<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Two teams overlapping — separate fields of work meeting in a shared centre.">
  <defs>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    </filter>
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40M0 40H40" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="hatchA" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0V12" stroke="#fff" stroke-opacity=".26" stroke-width="1"/>
    </pattern>
    <pattern id="hatchB" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <path d="M0 0V12" stroke="#fff" stroke-opacity=".26" stroke-width="1"/>
    </pattern>
    <clipPath id="overlap">
      <rect x="290" y="360" width="220" height="280"/>
    </clipPath>
  </defs>

  <rect width="800" height="1000" fill="#000"/>
  <rect width="800" height="1000" fill="url(#mesh)"/>

  <!-- field A -->
  <rect x="70" y="260" width="440" height="380" fill="url(#hatchA)"/>
  <rect x="70" y="260" width="440" height="380" fill="none" stroke="#fff" stroke-opacity=".7"/>

  <!-- field B -->
  <rect x="290" y="360" width="440" height="380" fill="url(#hatchB)"/>
  <rect x="290" y="360" width="440" height="380" fill="none" stroke="#fff" stroke-opacity=".7"/>

  <!-- the shared centre -->
  <rect x="290" y="360" width="220" height="280" fill="#ff2d16"/>
  <g clip-path="url(#overlap)" stroke="#000" stroke-opacity=".3">
    <path d="M290 400h220M290 440h220M290 480h220M290 520h220M290 560h220M290 600h220"/>
  </g>

  <!-- what each side brings -->
  <g fill="#fff" fill-opacity=".38">
    <rect x="70" y="190" width="130" height="8"/>
    <rect x="70" y="214" width="88" height="8"/>
    <rect x="600" y="782" width="130" height="8"/>
    <rect x="642" y="806" width="88" height="8"/>
  </g>
  <g stroke="#fff" stroke-opacity=".45" fill="none">
    <path d="M70 240h180M550 762h180"/>
  </g>

  <!-- connective ties into the centre -->
  <g fill="none" stroke="#ff2d16" stroke-width="2">
    <path d="M150 300v-40M150 260h60"/>
    <path d="M650 700v40M650 740h-60"/>
  </g>

  <!-- the working cadence -->
  <g fill="#fff" fill-opacity=".2">
    <rect x="70" y="860" width="34" height="34"/>
    <rect x="120" y="860" width="34" height="34"/>
    <rect x="170" y="860" width="34" height="34"/>
    <rect x="270" y="860" width="34" height="34"/>
    <rect x="320" y="860" width="34" height="34"/>
  </g>
  <rect x="220" y="860" width="34" height="34" fill="#ff2d16"/>
  <path d="M70 920h284" fill="none" stroke="#fff" stroke-opacity=".3"/>

  <rect width="800" height="1000" filter="url(#g)" opacity=".13" style="mix-blend-mode:screen"/>
</svg>
