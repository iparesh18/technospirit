<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Workflow graph — inputs routed through decision nodes to outputs, one path live.">
  <defs>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    </filter>
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40M0 40H40" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#ff2d16"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#fff" fill-opacity=".45"/>
    </marker>
  </defs>

  <rect width="800" height="1000" fill="#000"/>
  <rect width="800" height="1000" fill="url(#mesh)"/>

  <!-- dormant lattice -->
  <g fill="none" stroke="#fff" stroke-opacity=".18" marker-end="url(#aw)">
    <path d="M170 200H330V330H470"/>
    <path d="M170 520H330V400H470"/>
    <path d="M170 800H330V690H470"/>
    <path d="M550 330V470H630"/>
    <path d="M550 690V560H630"/>
  </g>

  <!-- live path -->
  <g fill="none" stroke="#ff2d16" stroke-width="2" marker-end="url(#ar)">
    <path d="M170 360H330V520H470"/>
    <path d="M550 520H630V520"/>
  </g>

  <!-- input nodes -->
  <g fill="none" stroke="#fff" stroke-opacity=".6">
    <rect x="90" y="170" width="80" height="60"/>
    <rect x="90" y="490" width="80" height="60"/>
    <rect x="90" y="770" width="80" height="60"/>
  </g>
  <rect x="90" y="330" width="80" height="60" fill="#ff2d16"/>

  <!-- processing column -->
  <g fill="none" stroke="#fff" stroke-opacity=".55">
    <rect x="470" y="290" width="80" height="80"/>
    <rect x="470" y="360" width="80" height="80"/>
    <rect x="470" y="650" width="80" height="80"/>
  </g>
  <g fill="none" stroke="#ff2d16" stroke-width="2">
    <rect x="470" y="480" width="80" height="80"/>
    <path d="M488 520h44M510 498v44"/>
  </g>

  <!-- output rail -->
  <g fill="none" stroke="#fff" stroke-opacity=".6">
    <path d="M630 140V880"/>
    <path d="M630 200h60M630 300h60M630 380h60M630 700h60M630 820h60"/>
  </g>
  <g stroke="#ff2d16" stroke-width="2" fill="none">
    <path d="M630 520h80"/>
  </g>
  <rect x="700" y="508" width="24" height="24" fill="#ff2d16"/>

  <!-- cycle: the loop back -->
  <g fill="none" stroke="#fff" stroke-opacity=".26" stroke-dasharray="6 8">
    <path d="M710 560V920H130V860"/>
  </g>

  <!-- run ledger -->
  <g fill="#fff" fill-opacity=".26">
    <rect x="90" y="900" width="120" height="7"/>
    <rect x="90" y="922" width="86" height="7"/>
    <rect x="90" y="944" width="104" height="7"/>
  </g>

  <rect width="800" height="1000" filter="url(#g)" opacity=".13" style="mix-blend-mode:screen"/>
</svg>
