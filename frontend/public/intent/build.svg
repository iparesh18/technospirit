<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Interface architecture — a wireframe layout resolving out of a construction grid.">
  <defs>
    <filter id="g" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    </filter>
    <pattern id="mesh" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0V40M0 40H40" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="1000" fill="#000"/>
  <rect width="800" height="1000" fill="url(#mesh)"/>

  <!-- construction ticks, left edge -->
  <g stroke="#fff" stroke-opacity=".3">
    <path d="M40 120h18M40 200h18M40 280h18M40 360h18M40 440h18M40 520h18M40 600h18M40 680h18M40 760h18M40 840h18"/>
    <path d="M40 440h34" stroke="#ff2d16" stroke-opacity="1"/>
  </g>

  <!-- the frame being built -->
  <g fill="none" stroke="#fff" stroke-opacity=".9">
    <rect x="110" y="120" width="620" height="720"/>
    <!-- header bar -->
    <path d="M110 196h620"/>
    <!-- sidebar -->
    <path d="M262 196v644"/>
  </g>

  <!-- header contents -->
  <g fill="#fff" fill-opacity=".55">
    <rect x="138" y="150" width="58" height="10"/>
    <rect x="628" y="150" width="30" height="10"/>
    <rect x="672" y="150" width="30" height="10"/>
  </g>

  <!-- sidebar rows -->
  <g fill="#fff" fill-opacity=".22">
    <rect x="138" y="232" width="96" height="8"/>
    <rect x="138" y="264" width="72" height="8"/>
    <rect x="138" y="296" width="88" height="8"/>
    <rect x="138" y="328" width="60" height="8"/>
  </g>
  <rect x="138" y="360" width="96" height="8" fill="#ff2d16"/>

  <!-- content grid -->
  <g fill="none" stroke="#fff" stroke-opacity=".34">
    <rect x="298" y="232" width="188" height="150"/>
    <rect x="510" y="232" width="188" height="150"/>
    <rect x="298" y="406" width="188" height="150"/>
    <rect x="510" y="406" width="188" height="150"/>
  </g>
  <rect x="298" y="232" width="188" height="150" fill="#ff2d16"/>

  <!-- copy block -->
  <g fill="#fff" fill-opacity=".3">
    <rect x="298" y="596" width="400" height="9"/>
    <rect x="298" y="626" width="340" height="9"/>
    <rect x="298" y="656" width="376" height="9"/>
    <rect x="298" y="686" width="228" height="9"/>
  </g>

  <!-- resolved footer rule + baseline dimension -->
  <g stroke="#fff" stroke-opacity=".55" fill="none">
    <path d="M298 764h400"/>
    <path d="M298 754v20M698 754v20"/>
  </g>

  <!-- unbuilt remainder: the grid still showing through -->
  <g fill="none" stroke="#fff" stroke-opacity=".14">
    <rect x="110" y="880" width="196" height="80"/>
    <rect x="322" y="880" width="196" height="80"/>
    <rect x="534" y="880" width="196" height="80"/>
  </g>

  <rect width="800" height="1000" filter="url(#g)" opacity=".13" style="mix-blend-mode:screen"/>
</svg>
